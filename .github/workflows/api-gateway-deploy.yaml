name: Deploy API Gateway

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy API Gateway
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'develop' }}
    permissions:
      contents: "write"
      id-token: "write"
    env:
      HELM_RELEASE_SUFFIX: gw
      CHART_NAME: api-gateway

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.16.0

      - name: Configure Google Cloud Auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_PLAYGROUND_WORKLOAD_IDP }}
          service_account: ${{ vars.GCP_GITHUB_ACTIONS_SERVICE_ACCOUNT }}

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a" # v2.1.4
        with:
          version: ">= 363.0.0"

      - id: get-credentials
        name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@64bc7249bbcf78056bb92f14d3cedc2da193946c # v2.3.5
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          cluster_name: ${{ vars.K8S_PLAYGROUND_NAME }}
          location: ${{ vars.GCP_K8S_LOCATION }}

      - name: Upgrade Pod
        run: |
          RELEASE="${{ vars.HELM_RELEASE_PREFIX }}${HELM_RELEASE_SUFFIX}"
          CHART="./infrastructure/k8s/helm/charts/${CHART_NAME}"

          if helm status "${RELEASE}" >/dev/null 2>&1; then
            echo "Release exists, performing upgrade..."
            helm upgrade "${RELEASE}" "${CHART}"
          else
            echo "No release found, performing install..."
            helm install "${RELEASE}" "${CHART}"
          fi

      - name: Tag deployment
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          GIT_TAG="api-gw-${TIMESTAMP}"
          echo "GIT_TAG=${GIT_TAG}" >> $GITHUB_ENV
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "${GIT_TAG}" -m "API Gateway deploy ${TIMESTAMP}"
          git push origin "${GIT_TAG}"
          echo "Created tag: ${GIT_TAG}"

      - name: Waiting for pods to be Ready
        run: |
          DEPLOY="${{ vars.HELM_RELEASE_PREFIX }}${HELM_RELEASE_SUFFIX}-${CHART_NAME}"
          echo "Waiting for '${DEPLOY}' pods to be in 'Running' state..."
          for i in {1..6}; do
            NEW_POD=$(kubectl get pods --no-headers --sort-by=.metadata.creationTimestamp | grep "^${DEPLOY}" | tail -n 1 | awk '{print $1}')
            POD_STATUS=$(kubectl get pod "${NEW_POD}" --no-headers | awk '{print $3}')

            if [[ "$POD_STATUS" == "Running" ]]; then
              echo "New '${DEPLOY}' pod (${NEW_POD}) is running"
              break
            else
              echo "New '${DEPLOY}' pod (${NEW_POD}) is still in state ${POD_STATUS}. Retrying in 10 seconds..."
              sleep 10
            fi
          done

      - name: Get Logs from New Pod
        run: |
          DEPLOY="${{ vars.HELM_RELEASE_PREFIX }}${HELM_RELEASE_SUFFIX}-${CHART_NAME}"
          NEW_POD=$(kubectl get pods --no-headers --sort-by=.metadata.creationTimestamp | grep "^${DEPLOY}" | tail -n 1 | awk '{print $1}')
          echo "Fetching logs for the new pod: ${NEW_POD}"
          kubectl logs "${NEW_POD}"

      - id: "get-pods"
        run: "kubectl get pods"

      - name: Deployment Summary
        run: |
          DEPLOY="${{ vars.HELM_RELEASE_PREFIX }}${HELM_RELEASE_SUFFIX}-${CHART_NAME}"
          NEW_POD=$(kubectl get pods --no-headers --sort-by=.metadata.creationTimestamp | grep "^${DEPLOY}" | tail -n 1 | awk '{print $1}')
          POD_STATUS=$(kubectl get pod "${NEW_POD}" --no-headers | awk '{print $3}')
          echo "## 🚀 API Gateway Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`${{ github.ref == 'refs/heads/master' && 'production' || 'develop' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Git Tag:** \`${{ env.GIT_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Helm Release:** \`${{ vars.HELM_RELEASE_PREFIX }}${HELM_RELEASE_SUFFIX}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Chart:** \`${CHART_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pod:** \`${NEW_POD}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pod Status:** ${POD_STATUS}" >> $GITHUB_STEP_SUMMARY
