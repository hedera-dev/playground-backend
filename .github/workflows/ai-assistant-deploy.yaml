name: Deploy AI Assistant

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image tag"
        required: true
        default: "latest"
        type: string
jobs:
  deploy:
    name: Deploy - ${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'develop' }}
    permissions:
      contents: "read"
      id-token: "write"
    env:
      HELM_RELEASE_SUFFIX: ai
      CHART_NAME: ai-assistant

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install yq
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/download/v4.18.1/yq_linux_amd64 -o /tmp/yq
          echo "c02cc9c58a3a1531c224406973d3d8b8c4e47bf5064c3af48a812c8c19d2d46e  /tmp/yq" | sha256sum -c
          sudo install /tmp/yq /usr/local/bin/yq


      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.16.0

      - name: Fill values (secrets and variables)
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          yq eval ".image.tag = \"${VERSION}\"" -i ./infrastructure/k8s/helm/charts/${{ env.CHART_NAME }}/values.yaml
          yq eval ".env.OPENAI_API_KEY = \"${{ secrets.AI_ASSISTANT_OPENAI_API_KEY }}\"" -i ./infrastructure/k8s/helm/charts/${{ env.CHART_NAME }}/values.yaml
          yq eval ".env.OPENAI_AGENT_API_KEY = \"${{ secrets.AI_ASSISTANT_OPENAI_AGENT_API_KEY }}\"" -i ./infrastructure/k8s/helm/charts/${{ env.CHART_NAME }}/values.yaml
          yq eval ".env.redis.password = \"${{ secrets.REDIS_PASSWORD }}\"" -i ./infrastructure/k8s/helm/charts/${{ env.CHART_NAME }}/values.yaml
          yq eval ".env.PG_PASSWORD = \"${{ secrets.PSQL_PASSWORD }}\"" -i ./infrastructure/k8s/helm/charts/${{ env.CHART_NAME }}/values.yaml
          yq eval ".env.CODE_REVIEW_MODEL = \"${{ vars.AI_ASSISTANT_MODEL }}\"" -i ./infrastructure/k8s/helm/charts/${{ env.CHART_NAME }}/values.yaml
          yq eval ".env.CODE_INTEGRATION_MODEL = \"${{ vars.AI_ASSISTANT_MODEL }}\"" -i ./infrastructure/k8s/helm/charts/${{ env.CHART_NAME }}/values.yaml
          yq eval ".env.GENERAL_ASSISTANT_MODEL = \"${{ vars.AI_ASSISTANT_MODEL }}\"" -i ./infrastructure/k8s/helm/charts/${{ env.CHART_NAME }}/values.yaml
          yq eval ".env.EXECUTION_ANALYZER_MODEL = \"${{ vars.AI_ASSISTANT_MODEL }}\"" -i ./infrastructure/k8s/helm/charts/${{ env.CHART_NAME }}/values.yaml
          yq eval ".env.TOKENS_LIMIT_PER_MONTH = \"${{ vars.AI_ASSISTANT_TOKENS_LIMIT_PER_MONTH }}\"" -i ./infrastructure/k8s/helm/charts/${{ env.CHART_NAME }}/values.yaml

      - name: Configure Google Cloud Auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_PLAYGROUND_WORKLOAD_IDP }}
          service_account: ${{ vars.GCP_GITHUB_ACTIONS_SERVICE_ACCOUNT }}

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a" # v2.1.4
        with:
          version: ">= 363.0.0"

      - id: get-credentials
        name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@64bc7249bbcf78056bb92f14d3cedc2da193946c # v2.3.5
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          cluster_name: ${{ vars.K8S_PLAYGROUND_NAME }}
          location: ${{ vars.GCP_K8S_LOCATION }}

      - name: Upgrade Pod
        run: |
          RELEASE="${{ vars.HELM_RELEASE_PREFIX }}${HELM_RELEASE_SUFFIX}"
          CHART="./infrastructure/k8s/helm/charts/${CHART_NAME}"

          if helm status "${RELEASE}" >/dev/null 2>&1; then
            echo "Release exists, performing upgrade..."
            helm upgrade "${RELEASE}" "${CHART}"
          else
            echo "No release found, performing install..."
            helm install "${RELEASE}" "${CHART}"
          fi

      - name: Restart deployment
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Restarting deployment.."
          kubectl rollout restart deployment "${{ vars.HELM_RELEASE_PREFIX }}${HELM_RELEASE_SUFFIX}-${CHART_NAME}-dpl"

      - name: Waiting for pods to be Ready
        run: |
          DEPLOY="${{ vars.HELM_RELEASE_PREFIX }}${HELM_RELEASE_SUFFIX}-${CHART_NAME}-dpl"
          echo "Waiting for '${DEPLOY}' pods to be in 'Running' state..."
          for i in {1..6}; do
            NEW_POD=$(kubectl get pods --no-headers --sort-by=.metadata.creationTimestamp | grep "^${DEPLOY}" | tail -n 1 | awk '{print $1}')
            POD_STATUS=$(kubectl get pod "${NEW_POD}" --no-headers | awk '{print $3}')

            if [[ "$POD_STATUS" == "Running" ]]; then
              echo "New '${DEPLOY}' pod (${NEW_POD}) is running"
              break
            else
              echo "New '${DEPLOY}' pod (${NEW_POD}) is still in state ${POD_STATUS}. Retrying in 10 seconds..."
              sleep 10
            fi
          done

      - name: Get Logs from New Pod
        run: |
          DEPLOY="${{ vars.HELM_RELEASE_PREFIX }}${HELM_RELEASE_SUFFIX}-${CHART_NAME}-dpl"
          NEW_POD=$(kubectl get pods --no-headers --sort-by=.metadata.creationTimestamp | grep "^${DEPLOY}" | tail -n 1 | awk '{print $1}')
          echo "Fetching logs for the new pod: ${NEW_POD}"
          kubectl logs "${NEW_POD}"

      - id: "get-pods"
        run: "kubectl get pods"

      - name: Deployment Summary
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          DEPLOY="${{ vars.HELM_RELEASE_PREFIX }}${HELM_RELEASE_SUFFIX}-${CHART_NAME}-dpl"
          NEW_POD=$(kubectl get pods --no-headers --sort-by=.metadata.creationTimestamp | grep "^${DEPLOY}" | tail -n 1 | awk '{print $1}')
          POD_STATUS=$(kubectl get pod "${NEW_POD}" --no-headers | awk '{print $3}')
          POD_AGE=$(kubectl get pod "${NEW_POD}" --no-headers | awk '{print $5}')
          echo "## 🚀 AI Assistant Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`${{ github.ref == 'refs/heads/master' && 'production' || 'develop' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Helm Release:** \`${{ vars.HELM_RELEASE_PREFIX }}${HELM_RELEASE_SUFFIX}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Chart:** \`${CHART_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Model:** \`${{ vars.AI_ASSISTANT_MODEL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pod:** \`${NEW_POD}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pod Status:** ${POD_AGE} ${POD_STATUS}" >> $GITHUB_STEP_SUMMARY
