# End-to-end auth harness for BRA-468: HAProxy + SPOE agent + an echo backend
# that reflects headers, so a 200 also shows the injected X-User-ID.
#
#   ZITADEL_AUDIENCE=<project id> docker compose -f docker-compose.dev.yaml up --build
#
# Defaults assume a ZITADEL dev instance on the host at :8080 (the token's iss
# is http://localhost:8080 while the container fetches the JWKS through
# host.docker.internal). Export PASETO_V4_PUBLIC_KEY_HEX to also exercise the
# legacy branch.
services:
  haproxy:
    image: haproxy:2.9
    ports:
      - "8081:8081"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./spoe-auth.conf:/usr/local/etc/haproxy/spoe-auth.conf:ro
    depends_on:
      - spoe-auth
      - echo

  spoe-auth:
    build: ..
    environment:
      MODE: spoe
      LISTEN_ADDR: ":9000"
      DEBUG: "true"
      PASETO_V4_PUBLIC_KEY_HEX: ${PASETO_V4_PUBLIC_KEY_HEX:-}
      # Parity with the deployed values: portal PATs carry no exp claim, so
      # the legacy branch runs without expiry rules. The JWT branch ignores
      # this flag and always demands exp.
      IGNORE_EXP: "true"
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:-http://localhost:8080}
      ZITADEL_JWKS_URL: ${ZITADEL_JWKS_URL:-http://zitadel-mirror:8080/oauth/v2/keys}
      ZITADEL_AUDIENCE: ${ZITADEL_AUDIENCE:?project id the token aud must contain}
      JWT_USER_CLAIM: ${JWT_USER_CLAIM:-urn:hedera:portal_user_id}
    depends_on:
      - zitadel-mirror

  # ZITADEL routes by Host header, so containers cannot hit the host's dev
  # instance directly — this mirror rewrites the Host on the way through.
  zitadel-mirror:
    image: nginx:1.27-alpine
    volumes:
      - ./zitadel-mirror.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  echo:
    image: mendhak/http-https-echo:37
    environment:
      HTTP_PORT: 8080
