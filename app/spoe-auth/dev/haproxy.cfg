# Local mirror of the api-gateway chart's HAProxy front (BRA-468): same SPOE
# wiring, same auth gate, same 15ms processing budget. CORS and rate limiting
# are left out — this harness exists to exercise authentication end to end.
global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend assistant-front
    bind :8081

    # Same path gate as the real gateway.
    acl is_health_check path_beg /api/playground/assistant/health
    acl allowed_path path_beg /api/playground/assistant
    http-request deny deny_status 404 if !allowed_path

    filter spoe engine auth config /usr/local/etc/haproxy/spoe-auth.conf

    http-request deny deny_status 401 if !{ var(txn.spoe.auth_ok) -m bool true } !is_health_check
    http-request set-header X-User-ID %[var(txn.spoe.user_id)] if { var(txn.spoe.auth_ok) -m bool true }

    default_backend assistant

backend backend-spoe-auth
    mode tcp
    server spoe-auth spoe-auth:9000

backend assistant
    # The echo backend reflects request headers, so a 200 response also shows
    # the X-User-ID HAProxy injected.
    http-request set-header X-User-ID %[var(txn.spoe.user_id)] if { var(txn.spoe.auth_ok) -m bool true }
    server echo echo:8080
