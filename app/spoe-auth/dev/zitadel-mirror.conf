# ZITADEL routes instances by Host header (EXTERNALDOMAIN), so a container
# reaching the host's dev instance through host.docker.internal gets a 404.
# This mirror forwards to the host while presenting the Host the instance
# expects — same trick the PoC's login container plays with
# CUSTOM_REQUEST_HEADERS=Host:localhost.
server {
    listen 8080;
    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host localhost:8080;
    }
}
